<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Streamlined Focus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand-title">✓ TaskFlow</div>
    <div style="font-size: 0.95rem; color: #94a3b8;">Daily Focus Hub</div>
  </header>

  <main class="container">
    <div class="task-card">
      <form class="task-form" onsubmit="addTask(event)">
        <input type="text" id="taskInput" class="task-input" placeholder="What task needs to be completed?" required>
        <button type="submit" class="btn-add">+ Add Task</button>
      </form>

      <ul class="task-list" id="taskList">
        <li class="task-item done">
          <div style="display: flex; align-items: center; gap: 14px;">
            <input type="checkbox" class="task-check" checked onchange="toggleTask(this)">
            <span>Review quarterly project roadmap</span>
          </div>
          <button class="task-delete" onclick="deleteTask(this)">Delete</button>
        </li>
        <li class="task-item">
          <div style="display: flex; align-items: center; gap: 14px;">
            <input type="checkbox" class="task-check" onchange="toggleTask(this)">
            <span>Organize client deliverables and invoices</span>
          </div>
          <button class="task-delete" onclick="deleteTask(this)">Delete</button>
        </li>
      </ul>
    </div>
  </main>

  <script>
    function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('taskInput');
      const val = input.value.trim();
      if (!val) return;

      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <div style="display: flex; align-items: center; gap: 14px;">
          <input type="checkbox" class="task-check" onchange="toggleTask(this)">
          <span>${val.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>
        </div>
        <button class="task-delete" onclick="deleteTask(this)">Delete</button>
      `;

      document.getElementById('taskList').appendChild(li);
      input.value = '';
    }

    function toggleTask(checkbox) {
      const item = checkbox.closest('.task-item');
      if (checkbox.checked) {
        item.classList.add('done');
      } else {
        item.classList.remove('done');
      }
    }

    function deleteTask(btn) {
      btn.closest('.task-item').remove();
    }
  </script>
</body>
</html>
